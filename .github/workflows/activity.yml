name: Daily GitHub Activity Bot

on:
  schedule:
    # Every 30 min from 09:00 to 23:30 IST (03:30-18:00 UTC).
    # Each run only commits if a randomly planned slot for today has passed.
    - cron: '*/30 3-18 * * *'
  workflow_dispatch:

concurrency:
  group: activity-bot
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config user.name "iakashmall"
          git config user.email "akash.mall.mac@gmail.com"

      - name: Make randomized commits
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 << 'EOF'
          import os, random, subprocess, time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          IST = ZoneInfo("Asia/Kolkata")
          now = datetime.now(IST)
          today = now.strftime("%Y-%m-%d")
          is_manual = os.environ.get("EVENT") == "workflow_dispatch"

          messages = [
            "fix: resolve minor bug in logic",
            "chore: update dependencies",
            "refactor: clean up unused code",
            "docs: improve readme clarity",
            "feat: add minor utility function",
            "style: format code consistently",
            "test: update test descriptions",
            "perf: optimize loop performance",
            "chore: sync daily log",
            "fix: correct typo in comments",
          ]

          # ---- Today's plan: same for every run today (seeded by date) ----
          plan = random.Random(today)
          weekend = now.weekday() >= 5
          skip_day = weekend and plan.random() < 0.45      # skip ~45% of weekend days
          # 2-8 commits, weighted toward the middle (3-5 most common)
          target = plan.choices(range(2, 9), weights=[10, 20, 22, 20, 14, 9, 5])[0]
          # random slots between 09:15 and 23:15 IST, as minutes since midnight
          slots = sorted(plan.sample(range(9 * 60 + 15, 23 * 60 + 15), target))
          print(f"Plan {today}: skip={skip_day} target={target} "
                f"slots={[f'{m//60:02d}:{m%60:02d}' for m in slots]}")

          if skip_day and not is_manual:
              print("Weekend rest day, nothing to do.")
              raise SystemExit(0)

          # ---- How many are already done today / due now ----
          done = 0
          if os.path.exists("daily_log.txt"):
              with open("daily_log.txt") as f:
                  done = sum(1 for line in f if line.startswith(today))

          now_min = now.hour * 60 + now.minute
          due = sum(1 for s in slots if s <= now_min)
          to_make = max(0, due - done)
          if is_manual and to_make == 0:
              to_make = 1
          print(f"done={done} due={due} -> committing {to_make}")

          if to_make == 0:
              raise SystemExit(0)

          # small random jitter so timestamps aren't on a 30-min grid
          time.sleep(random.randint(0, 420))

          for _ in range(to_make):
              msg = random.choice(messages)
              ts = datetime.now(IST).strftime("%Y-%m-%d %H:%M:%S")
              with open("daily_log.txt", "a") as f:
                  f.write(f"{ts} — {msg}\n")
              subprocess.run(["git", "add", "daily_log.txt"], check=True)
              subprocess.run(["git", "commit", "-m", msg], check=True)
              if to_make > 1:
                  time.sleep(random.randint(20, 240))   # spread catch-up commits

          subprocess.run(["git", "pull", "--rebase"], check=True)
          subprocess.run(["git", "push"], check=True)
          print(f"Pushed {to_make} commit(s)")
          EOF
